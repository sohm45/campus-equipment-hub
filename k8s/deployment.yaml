
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-equipment-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-equipment-hub
  template:
    metadata:
      labels:
        app: campus-equipment-hub
    spec:
      containers:
        - name: campus-equipment-hub
          image: soham045/campus-equipment-hub:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
